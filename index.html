:root{color-scheme:light dark;--bg:light-dark(#e6ebf2,#0b1220);--ink:#16202e;--mute:#5d6b7e;--line:#cdd6e1;--soft:#f2f5f9;--navy:#0b2a5b;--deep:#001a40;--acc:#f0a020;--ok:#1d8a4e;--x:#d63b3b}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);font:15px/1.5 "Noto Sans KR",system-ui,sans-serif;overflow-x:clip}
.sheet{max-width:1180px;margin:16px auto 110px;background:#fff;color:var(--ink);border-radius:10px;overflow:hidden;box-shadow:0 2px 18px rgba(0,20,60,.14)}

.logo{display:flex;align-items:center;gap:9px;font-weight:900;font-size:19px;letter-spacing:.14em}.logo img{height:34px}
.band h1{margin:0 0 0 auto;font-size:19px;font-weight:900;text-align:end;line-height:1.25}

.note{background:#fff3dc;color:#6e4300;font-weight:700;font-size:14px;padding:7px 22px;border-bottom:1px solid var(--line);display:flex;gap:10px;flex-wrap:wrap;align-items:center}

.sec{padding:14px 22px;border-bottom:1px solid var(--line)}
h2{font-size:15.5px;font-weight:900;color:var(--navy);margin:0 0 9px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));border-top:1px solid var(--line);border-left:1px solid var(--line)}

.cell>div,td{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.cell>div{padding:5px 8px}

.u{color:var(--mute);font-size:13px}
.chip{font:inherit;font-size:13.5px;border:1px solid #b9c5d4;background:#fff;color:var(--ink);border-radius:20px;padding:5px 12px;min-height:38px;cursor:pointer}

.chip.g[aria-pressed=true]{background:var(--ok)}.chip.y[aria-pressed=true]{background:#b97f00}.chip.r[aria-pressed=true]{background:var(--x)}
.chip.sm{font-size:12.5px;min-height:34px;padding:3px 10px}
.tag{display:inline-block;padding:2px 10px;border-radius:12px;font-size:13px;font-weight:700;white-space:nowrap}
.g{--t:#e2f3e9;--c:#14663a}.y{--t:#fcefcc;--c:#7a5300}.r{--t:#fde0e0;--c:#a51f1f}.n{--t:#e7eef8;--c:#0b2a5b}.o{--t:#fde3c8;--c:#9a4d00}
.tag{background:var(--t);color:var(--c)}
.dash{color:#9aa6b5}.txt{color:var(--ink);font-size:13.5px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.two>.sec+.sec{border-left:1px solid var(--line)}
table{width:100%;border-collapse:collapse}
tr{border-bottom:1px solid var(--line)}tr:last-child{border-bottom:0}
th{text-align:start;font-size:13.5px;font-weight:700;padding:7px 8px 7px 0;width:40%;vertical-align:top}
td{padding:6px 0}
.sum th{width:30%;background:var(--soft);padding-left:8px;color:var(--navy)}.sum td{padding:6px 8px}
.sum td input:not(.n){flex:1 1 220px}
.sum{border:1px solid var(--line)}
.leg{font-size:12.5px;color:var(--mute);display:grid;gap:3px;margin-bottom:8px}.leg b{color:var(--ink)}

.view .pn{cursor:default}

.prow{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0 10px}

.ped label{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-weight:700}
.ped>div{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.hint{color:var(--mute);font-size:13.5px;text-align:center;margin:4px 0}
.ptab td,.ptab th{display:table-cell;font-size:13px;padding:5px 6px;width:auto;vertical-align:middle}.ptab thead th{color:var(--mute);font-weight:500}
.r{text-align:right}
.okline{color:var(--ok);font-weight:700;margin:6px 0}.mute{color:var(--mute);font-size:12.5px;margin:6px 0 0}

.rmk{white-space:pre-wrap;font-size:15px;margin:0}
.share{background:var(--soft)}.share .lk{display:flex;gap:6px;margin:4px 0 10px}.share label{font-weight:700;font-size:13.5px}

.btn{font:inherit;font-weight:700;font-size:14.5px;min-height:44px;border-radius:8px;padding:0 16px;cursor:pointer;border:1px solid transparent;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;white-space:nowrap}
.btn.main{background:var(--acc);color:#18212b}.btn.ghost{background:transparent;color:#fff;border-color:#4d668c}.btn.dark{background:var(--navy);color:#fff}
.btn.wa{background:#25d366;color:#08311a}.btn.kk{background:#fee500;color:#191600}.sbtns{display:flex;flex-wrap:wrap;gap:8px}.sbtns .btn{flex:1 1 260px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--deep);padding:10px max(14px,4vw) calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;flex-wrap:wrap;justify-content:center;z-index:5;box-shadow:0 -2px 12px rgba(0,0,0,.2)}
.seg{display:inline-flex;border:1px solid #4d668c;border-radius:8px;overflow:hidden}.seg button{font:inherit;font-weight:700;background:none;color:#a9bfe0;border:0;min-width:48px;min-height:42px;cursor:pointer}
.seg button[aria-pressed=true]{background:#fff;color:var(--deep)}
.foot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px;padding:12px 22px;font-size:13px;color:var(--mute)}.foot a{color:var(--navy);font-weight:700}
.who{margin-left:auto;font-size:13px;color:#a9bfe0}.who button{font:inherit;color:#fff;background:none;border:1px solid #4d668c;border-radius:6px;padding:2px 8px;cursor:pointer}
.login form{display:grid;gap:12px;max-width:380px;margin:10px auto 20px}.login label{display:grid;gap:4px;font-weight:700}.login label.chk{display:flex;align-items:center;gap:8px;font-weight:500;min-height:44px;cursor:pointer}.login .chk input{width:22px;height:22px;min-height:0;accent-color:#0b2a5b}.err{color:#a51f1f;font-weight:700;margin:4px 0}
.list tr{cursor:pointer}.list tbody tr:hover{background:var(--soft)}#q{margin-bottom:10px;max-width:420px}
.sendf{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr) auto;gap:8px;margin-bottom:12px}@media(max-width:700px){.sendf{grid-template-columns:1fr}}
.donep{text-align:center;display:grid;gap:10px;justify-items:center;padding:30px 22px}.donep .big{font-size:26px;font-weight:900;color:var(--ok);margin:0}.donep input{max-width:560px;font-size:13px}.btn.ghost2{background:none;border:1px solid var(--line);color:var(--navy)}
.modal{position:fixed;inset:0;background:rgba(0,10,30,.55);display:grid;place-items:center;z-index:20;padding:16px}.modal>div{background:#fff;color:var(--ink);border-radius:12px;padding:20px;max-width:380px;width:100%}
.orig{background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:0 0 8px;white-space:pre-wrap}details.mute{margin:4px 0 6px}details summary{cursor:pointer;min-height:32px}
.pdf{max-width:none;margin:0;box-shadow:none;border-radius:0}.pdf .two{grid-template-columns:1fr 1fr!important}.pdf .two>.sec+.sec{border-left:1px solid var(--line)!important}
.pdf tr{display:table-row!important}.pdf th{width:40%!important;padding:5px 8px 5px 0!important}.pdf .sum th{width:30%!important;background:var(--soft)!important;padding-left:8px!important}
.pdf .sec{padding:8px 14px}.pdf .views{gap:8px;max-width:600px}.pdf .key{padding:8px 14px}.pdf .band{padding:10px 14px}.pdf .note{padding:5px 14px}.pdf .foot{padding:8px 14px}.pdf .band h1{margin-left:auto;text-align:end}.pdf .sheet{margin:0}
.ver{color:#b0bccb;font-size:11px}.pdf .ver{display:none}
.del{background:none;border:0;font-size:18px;min-width:40px;min-height:40px;cursor:pointer;opacity:.7}.del:hover{opacity:1}
.btn.delbtn{background:#fde0e0;color:#a51f1f;border-color:#f3b4b4;margin-top:10px}

@media(max-width:860px){.two{grid-template-columns:1fr}.two>.sec+.sec{border-left:0}}
.vw figcaption{font-size:12px}
@media(max-width:600px){.views{gap:4px}.sec,.band,.key,.foot{padding-left:14px;padding-right:14px}.note{padding:7px 14px}.sheet{margin:0 0 120px;border-radius:0}
 tr{display:grid}th{width:auto;padding-bottom:2px}.sum th{background:none;padding-left:8px}.band h1{margin-left:0;text-align:start}.ptab tr{display:table-row}}

async function rasterSvgs(root) {
 await Promise.all([...root.querySelectorAll('svg')].map(sv => new Promise(res => {
  const r = sv.getBoundingClientRect(), w = Math.max(1, Math.round(r.width)), h = Math.max(1, Math.round(r.height)), k = 3;
  const c = sv.cloneNode(true); c.setAttribute('xmlns', 'http://www.w3.org/2000/svg'); c.setAttribute('width', w * k); c.setAttribute('height', h * k); c.setAttribute('font-family', 'Arial, sans-serif');
  c.querySelectorAll('.pn').forEach(pth => { pth.setAttribute('stroke', '#6f7f95'); pth.setAttribute('stroke-width', '1.3'); });
  const im = new Image();
  im.onload = () => { try { const cv = document.createElement('canvas'); cv.width = w * k; cv.height = h * k; cv.getContext('2d').drawImage(im, 0, 0, w * k, h * k);
    const out = new Image(); out.style.cssText = `width:${w}px;height:${h}px;display:block;margin:0 auto;flex:none`; out.onload = out.onerror = res; out.src = cv.toDataURL('image/png'); sv.replaceWith(out); } catch (e) { res(); } };

 })));
}

}

 else if (a === 'kakao') { const url = $('#lkKo') && $('#lkKo').value; if (!url) return;
  const info = carInfo(); const msg = `🚗 [AutoMatch 진단평가지]\n${info}\n${url}`;
  if (navigator.share) navigator.share({text:msg}).catch(() => {}); else { $('#lkKo').value = msg; copy('lkKo', T('복사됨 — 카카오톡에 붙여넣기','Copied — paste it in KakaoTalk')); $('#lkKo').value = url; } }
 else if (a === 'edit') { MODE = 'edit'; render(); }
 else if (a === 'cancel') { loadReport(RID); }
 else if (a === 'saveedit') {
  BUSY = true; render();
  const {error} = await sb.from('reports').update({data:prune(S), plate:S.f.plate||null, model:S.f.model||null, updated_at:new Date().toISOString()}).eq('id', RID);
  BUSY = false; if (error) { toast(error.message); render(); return; } SEL = null; toast(T('저장됨','Saved')); loadReport(RID);
 }
 else if (a === 'nodel') { DELCF = null; keep(); }
 else if (a === 'dodel') {
  BUSY = true; keep(); const id = DELCF;
  const {error} = await sb.from('reports').delete().eq('id', id);
  BUSY = false; DELCF = null;
  if (error) { toast(error.message); keep(); return; }
  toast(T('삭제됨','Deleted')); LIST = LIST.filter(r => r.id !== id); TOTAL = Math.max(0, TOTAL - 1);
  if (PAGE === 'report') go(''); else keep();
 }
 else if (a === 'savermk') {
  S.f.rmkEn = $('#rmkEnBox').value.trim(); BUSY = true;
  const {error} = await sb.from('reports').update({data:prune(S), updated_at:new Date().toISOString()}).eq('id', RID);
  BUSY = false; toast(error ? error.message : T('저장됨','Saved')); keep();
 }
 else if (a === 'makepdf') {
  const mg = $('#mg').value.trim(); if (!mg) { toast(T('담당 매니저 이름을 입력하세요','Enter the manager name')); $('#mg').focus(); return; }
  try { localStorage.setItem('am_mgr', mg); } catch (e) {}
  BN = $('#bn').value.trim(); if (!BN) { toast(T('바이어 이름을 입력하세요','Enter the buyer name')); $('#bn').focus(); return; }
  BUSY = true; keep();
  try { PDFB = await makePdf(); } catch (e) { toast(e.message); }
  BUSY = false; keep();
 }
 else if (a === 'sharepdf') {
  const name = ($('#bn').value.trim()) || BN; if (!name) { toast(T('바이어 이름을 입력하세요','Enter the buyer name')); return; }
  const file = new File([PDFB], pdfName(), {type:'application/pdf'});
  let sent = false;
  if (navigator.canShare && navigator.canShare({files:[file]})) {
   try { await navigator.share({files:[file]}); sent = true; } catch (e) { if (e.name !== 'AbortError') { savePdfBlob(PDFB); sent = true; } }
  } else { savePdfBlob(PDFB); sent = true; toast(T('PDF 다운로드됨 — WhatsApp에 첨부하세요','PDF downloaded — attach it in WhatsApp')); }
  if (sent) { await logSend(name, ($('#mg') && $('#mg').value.trim()) || MG()); PDFB = null; BN = ''; keep(); }
 }
 else if (a === 'dlpdf') {
  BUSY = true; render();
  try { savePdfBlob(await makePdf()); } catch (e) { toast(e.message); }
  BUSY = false; render();
 }
 else if (a === 'send') {
  const name = $('#bn').value.trim(), phone = $('#bp').value.replace(/\D/g, '');
  if (!name) { toast(T('바이어 이름을 입력하세요','Enter the buyer name')); $('#bn').focus(); return; }
  if (phone && phone.length < 8) { toast(T('국가번호 포함 전체 번호를 입력하세요','Enter the full number with country code')); return; }
  const text = `AutoMatch Korea — Vehicle Inspection Report\n${S.f.model||''} ${S.f.year||''}\n${repLink('en', RID)}`;
  window.open(`https://wa.me/${phone}?text=` + encodeURIComponent(text), '_blank');
  const {error} = await sb.from('sends').insert({report_id:RID, buyer_name:name, buyer_phone:phone||null});
  if (error) { toast(error.message); return; }
  SENDS.unshift({buyer_name:name, buyer_phone:phone, sent_at:new Date().toISOString()}); render(); toast(T('보낸 기록 저장됨','Send recorded'));
 }
}
document.addEventListener('submit', async e => {
 if (e.target.id !== 'lf') return; e.preventDefault();
 let id = $('#lid').value.trim().toLowerCase(); const pw = $('#lpw').value; const keepId = $('#sid') ? $('#sid').checked : true;
 if (!id || !pw) return; if (!id.includes('@')) id += DOMAIN;
 BUSY = true; ERR = ''; render(); $('#lid').value = id.replace(DOMAIN, '');
 const {error} = await sb.auth.signInWithPassword({email:id, password:pw});
 BUSY = false;
 if (error) { ERR = T('ID 또는 비밀번호가 맞지 않습니다','Wrong ID or password'); render(); $('#lid').value = id.replace(DOMAIN, ''); return; }
 try { localStorage.setItem('am_sid', keepId ? '1' : '0'); if (keepId) localStorage.setItem('am_id', id.replace(DOMAIN, '')); else localStorage.removeItem('am_id'); } catch (e) {}
 const h = AFTER; AFTER = ''; go(h);
});
let qt; document.addEventListener('input', e => { if (e.target.id === 'q') { Q = e.target.value; clearTimeout(qt); qt = setTimeout(loadList, 350); } });
document.addEventListener('click', e => {
 const dl = e.target.closest('[data-del]'); if (dl) { if (ROLE === 'admin') { DELCF = dl.dataset.del; keep(); } return; }
 const tr = e.target.closest('[data-open]'); if (tr) { go('#ko.' + tr.dataset.open); return; }
 const b = e.target.closest('[data-f],[data-sel],[data-pc],[data-std],[data-act],[data-lang],[data-copy],[data-step]');
 if (!b) return; const d = b.dataset;
 if (d.lang) { L = d.lang; render(); return; }
 if (d.copy) { copy(d.copy); return; }
 if (d.act) { act(d.act); return; }
 if (MODE !== 'edit' || !(PAGE === 'form' || PAGE === 'report')) return;
 if (d.step) { const n = ORDER.length, i = ORDER.indexOf(SEL); SEL = ORDER[SEL ? (i + (+d.step) + n) % n : 0]; keep(); focusEd(); return; }
 if (d.sel) { SEL = d.sel; keep(); focusEd(); return; }
 if (d.f) { const id = d.f, v = d.v; if (d.m) { const a = S.f[id] || []; S.f[id] = a.includes(v) ? a.filter(x => x !== v) : [...a, v]; } else S.f[id] = S.f[id] === v ? '' : v; }
 else if (d.pc) { const p = P(d.pc); p[d.k] = p[d.k].includes(d.v) ? p[d.k].filter(x => x !== d.v) : [...p[d.k], d.v]; }
 else if (d.std) S.std = +d.std;
 save(); keep();
});
function keep() { const y = scrollY; render(); scrollTo(0, y); }
function focusEd() { const e = $('#ped'); if (!e) return; const r = e.getBoundingClientRect(); if (r.bottom > innerHeight - 70) scrollBy(0, r.bottom - innerHeight + 80); const i = e.querySelector('[data-pt]'); if (i) { i.focus({preventScroll:true}); i.select(); } }
document.addEventListener('change', e => { const t = e.target; if (t.dataset.jump !== undefined && MODE === 'edit') { SEL = t.value; keep(); focusEd(); } });
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.dataset && e.target.dataset.pt) { e.preventDefault(); const n = ORDER.length; SEL = ORDER[(ORDER.indexOf(SEL) + 1) % n]; keep(); focusEd(); } });
document.addEventListener('input', e => {
 const t = e.target; if (MODE !== 'edit' || !(PAGE === 'form' || PAGE === 'report')) return;
 if (t.dataset.i) { S.f[t.dataset.i] = t.value; save(); }
 else if (t.dataset.pt && SEL) { P(SEL).t = t.value.replace(/\D/g,''); save(); $('#views').innerHTML = views(); const c = $('#pcls'); if (c) c.innerHTML = clsTag(P(SEL).t); }
});
addEventListener('hashchange', () => { SEL = null; route(); });
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
if (!sb) { $('#app').innerHTML = '<div class="sec">Could not load. Check your internet and refresh.</div>'; } else route();
}
</script>
